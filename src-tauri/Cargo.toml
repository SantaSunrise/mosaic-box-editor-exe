[package]
name = "mosaic-box-editor"
version = "0.0.2"
description = "Draw mosaic regions on local videos"
edition = "2021"
license = "MIT"
default-run = "mosaic-box-editor"

[lib]
name = "mosaic_box_core"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
open = "5"
ureq = { version = "3", features = ["json"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "mosaic-box-editor"
path = "src/main.rs"
